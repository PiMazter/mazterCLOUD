# ==================================================================
# mazterCLOUD - Direccionador de recursos (edicion super3, LIGERA)
#
# UNICA fuente de direccionamiento de la edicion. Los scripts del
# cliente descargan este archivo y lo OBEDECEN en cada ejecucion.
# super3 es una edicion LIGERA: su canal ofrece menu + listas +
# superposiciones (fixes/pimazterart NO; van horneados en la imagen).
# Las vars de los modulos ausentes no se declaran a proposito.
#
# Fuente local versionada: P:\Claude\mazterCLOUD\publico
# (clon de github.com/PiMazter/mazterCLOUD). Editar aqui, luego
# git add + commit + push.
# ==================================================================

# --- Sistema (scripts del menu, textos, config, el propio menu) ---
RCLONE_REMOTE_SCRIPTS="r2:maztercloud/super3/scripts"
RCLONE_REMOTE_TEXTOS="r2:maztercloud/super3/textos"
RCLONE_REMOTE_CONFIG="r2:maztercloud/super3/config"
RCLONE_REMOTE_MENU="r2:maztercloud/super3/retropiemenu"

# --- Contenido curado ---
RCLONE_REMOTE_GAMELISTS="r2:maztercloud/super3/contenido/gamelists"
# Superposiciones: el MANIFEST (suscripcion de la edicion) vive aqui;
# el ARTE vive UNA sola vez en el pool del catalogo (pool visual 2026-07-16).
RCLONE_REMOTE_SUPERPOSICIONES="r2:maztercloud/super3/contenido/superposiciones"
RCLONE_REMOTE_POOL_SUPERPOSICIONES="r2:maztercloud/pool/superposiciones"
# PiMazterART (2026-10-05): el MANIFEST vive en el espacio de la edicion y los
# CUADROS, una sola vez, en pool/. Sin estas lineas el modulo buscaba los
# cuadros en el espacio de la edicion, que solo lleva el manifest.
RCLONE_REMOTE_PIMAZTERART="r2:maztercloud/super3/contenido/pimazterart"
RCLONE_REMOTE_POOL_PIMAZTERART="r2:maztercloud/pool/pimazterart"

# --- Portero (N1) ---
PORTERO_URL="https://portero.pimazter.com/pase"
